<!DOCTYPE html>
<html lang="es">
<head>
    <!--
        ============================================================
        Quest Widgets - Reloj Flotante
        ============================================================
        Aplicacion WebXR para Meta Quest 3.
        Widget flotante estilo Apple Vision Pro con glassmorphism.
        Primer widget de la coleccion Quest Widgets.
        
        Stack: HTML5, CSS3, JavaScript, A-Frame, WebXR
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Widgets - Reloj</title>
    
    <!-- A-Frame - Framework WebXR para escenas 3D/VR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        ============================================================
        ESCENA A-FRAME
        ============================================================
        La escena contiene todo el entorno 3D/VR.
        - webxr: habilita el modo VR/WebXR
        - renderer: configura transparencia alpha para fondo limpio
        - rayOrigin: mouse permite interaccion en desktop
    -->
    <a-scene 
        webxr="requiredFeatures: local-floor, hand-tracking; optionalFeatures: dom-overlay, layers; overlayElement: #overlay"
        renderer="antialias: true; alpha: true; colorManagement: true; highRefreshRate: true"
        background="color: #000000"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable">

        <!--
            ============================================================
            ASSETS
            ============================================================
            Precarga de recursos y definicion de mixins reutilizables.
        -->
        <a-assets>
            <!-- Mixin para botones interactivos con transiciones suaves -->
            <a-mixin 
                id="btn-mixin"
                animation__enter="property: scale; to: 1.05 1.05 1.05; dur: 200; easing: easeOutQuad; startEvents: mouseenter"
                animation__leave="property: scale; to: 1 1 1; dur: 200; easing: easeOutQuad; startEvents: mouseleave"
                animation__click="property: scale; to: 0.95 0.95 0.95; dur: 100; easing: easeInQuad; startEvents: mousedown"
                animation__release="property: scale; to: 1 1 1; dur: 100; easing: easeOutQuad; startEvents: mouseup">
            </a-mixin>
        </a-assets>

        <!--
            ============================================================
            ILUMINACION
            ============================================================
            Iluminacion suave y ambiental para efecto glassmorphism.
            - Ambient light: luz base suave
            - Directional: luz direccional sutil para dar volumen
        -->
        <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.4" position="0 2 1"></a-light>

        <!--
            ============================================================
            CAMARA
            ============================================================
            La camara representa al usuario en el espacio 3D.
            - Posicion: 0 1.6 0 (altura ojos promedio)
            - look-controls: permite mirar alrededor
            - wasd-controls: movimiento con teclado (debug desktop)
        -->
        <a-entity id="camera-rig" position="0 0 0">
            <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false">
                <!-- Cursor laser para controladores VR -->
                <a-entity cursor="fuse: false" raycaster="objects: .clickable" position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                    material="color: white; shader: flat; opacity: 0.8">
                </a-entity>
            </a-camera>
        </a-entity>

        <!--
            ============================================================
            WIDGET RELOJ - PANEL PRINCIPAL
            ============================================================
            Contenedor 3D del widget flotante.
            - Posicion: 0 1.6 -1.5 (frente al usuario, a 1.5m)
            - Panel con efecto glassmorphism
            - Interactivo: arrastrable con controladores
        -->
        <a-entity id="widget-container" position="0 1.6 -1.5" rotation="0 0 0">
            
            <!-- Panel de fondo: superficie glassmorphism -->
            <a-plane 
                id="clock-panel"
                width="0.7" 
                height="0.38"
                material="color: #FFFFFF; opacity: 0.18; transparent: true; shader: flat; side: double; blending: additive"
                class="clickable"
                shadow="cast: false; receive: false">
            </a-plane>

            <!-- Borde del panel: linea sutil blanca -->
            <a-plane 
                id="clock-border"
                width="0.71" 
                height="0.39"
                position="0 0 -0.001"
                material="color: #FFFFFF; opacity: 0.15; transparent: true; shader: flat; side: double"
                shadow="cast: false; receive: false">
            </a-plane>

            <!--
                ============================================================
                TEXTO: HORA
                ============================================================
                Muestra la hora actual en formato grande.
                Se actualiza cada segundo via JavaScript.
            -->
            <a-text 
                id="clock-time"
                value="--:--"
                align="center"
                position="0 0.06 0.01"
                width="2.8"
                color="#FFFFFF"
                font="kelsonsans"
                shader="msdf">
            </a-text>

            <!--
                ============================================================
                TEXTO: FECHA
                ============================================================
                Muestra la fecha actual debajo de la hora.
                Ejemplo: "Martes, 14 de julio"
            -->
            <a-text 
                id="clock-date"
                value="Cargando..."
                align="center"
                position="0 -0.06 0.01"
                width="1.4"
                color="#FFFFFF"
                opacity="0.85"
                font="kelsonsans"
                shader="msdf">
            </a-text>

            <!--
                ============================================================
                BOTON: RECENTRAR
                ============================================================
                Boton para volver el widget a la posicion original.
                Aparece debajo de la fecha.
            -->
            <a-entity id="recenter-btn" position="0 -0.14 0.02" class="clickable" mixin="btn-mixin">
                <!-- Fondo del boton -->
                <a-plane 
                    width="0.22" 
                    height="0.06"
                    material="color: #FFFFFF; opacity: 0.12; transparent: true; shader: flat; side: double; blending: additive"
                    radius="0.03">
                </a-plane>
                <!-- Borde sutil del boton -->
                <a-plane 
                    width="0.225" 
                    height="0.065"
                    position="0 0 -0.001"
                    material="color: #FFFFFF; opacity: 0.1; transparent: true; shader: flat; side: double">
                </a-plane>
                <!-- Texto del boton -->
                <a-text 
                    value="Recentrar"
                    align="center"
                    position="0 0 0.01"
                    width="1.2"
                    color="#FFFFFF"
                    opacity="0.9"
                    font="kelsonsans"
                    shader="msdf">
                </a-text>
            </a-entity>

        </a-entity>

        <!--
            ============================================================
            CONTROLADORES VR
            ============================================================
            Modelos de los controladores Meta Quest.
            - laser-controls: emite rayo laser para interaccion
            - raycaster: detecta objetos clickeables
        -->
        <a-entity id="left-controller" laser-controls="hand: left" raycaster="objects: .clickable; far: 5; lineColor: #ffffff; lineOpacity: 0.3"></a-entity>
        <a-entity id="right-controller" laser-controls="hand: right" raycaster="objects: .clickable; far: 5; lineColor: #ffffff; lineOpacity: 0.3"></a-entity>

    </a-scene>

    <!--
        ============================================================
        OVERLAY HTML (DOM Overlay para WebXR)
        ============================================================
        Contenedor para elementos HTML que se muestran sobre la escena.
        Util para el boton de entrada VR y mensajes informativos.
    -->
    <div id="overlay" class="dom-overlay">
        <!-- Boton para entrar en modo VR/WebXR -->
        <button id="enter-vr-btn" class="vr-button">
            Entrar en VR
        </button>
        
        <!-- Mensaje de carga inicial -->
        <div id="loading-msg" class="loading-message">
            <p>Quest Widgets - Reloj</p>
            <p class="loading-sub">Cargando escena...</p>
        </div>
        
        <!-- Instrucciones -->
        <div id="instructions" class="instructions hidden">
            <p>Usa el controlador para apuntar y seleccionar</p>
            <p>Arrastra el panel para moverlo</p>
        </div>
    </div>

    <!-- Script principal de la aplicacion -->
    <script src="app.js"></script>

</body>
</html>
