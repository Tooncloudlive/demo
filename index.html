<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Glass Clock - A premium glassmorphism clock inspired by visionOS">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Glass Clock</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Inter font: weights 200, 400 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- 
    Glass Clock
    A single floating glass panel displaying time and date.
    The body has no background — it's transparent for MR/Quest use.
  -->
  
  <main class="app">
    <!-- Glass Panel -->
    <div class="glass-panel" id="glassPanel">
      <!-- Dynamic specular highlight (follows cursor) -->
      <div class="specular-layer" id="specularLayer"></div>
      
      <!-- Content -->
      <div class="panel-content">
        <time class="clock-time" id="clockTime" aria-live="polite">--:--</time>
        <p class="clock-date" id="clockDate">---</p>
      </div>
    </div>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
